{% extends 'base.html' %}
{% block content %}

<div class="form-container">
    <div class="form-card">

        <h1>Login</h1>
        <p class="subtitle">Sign in to continue to Communications.</p>

        {% if messages %}
            {% for message in messages %}
                <p style="color:#b00020; font-weight:600;">
                    {{ message }}
                </p>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    class="form-control"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control"
                    required
                >
            </div>

            <button type="submit" class="btn">
                Log In
            </button>
        </form>

        <div style="margin-top:15px;">
            <a href="{% url 'communications_register' %}" class="btn">
                Register
            </a>
        </div>

    </div>
</div>

{% endblock %}
