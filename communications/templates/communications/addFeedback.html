{% extends 'base.html' %}
{% block content %}

<div class="form-container">
    <div class="form-card">

        <h1>Add Feedback</h1>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn">
                Submit Feedback
            </button>

        </form>

    </div>
</div>

{% endblock %}
