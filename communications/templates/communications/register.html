{% extends 'base.html' %}
{% block content %}

<h1>Register</h1>
<p class="subtitle">Create your account for Communications.</p>

{% if messages %}
    {% for message in messages %}
        <p style="color:#b00020; font-weight:600;">{{ message }}</p>
    {% endfor %}
{% endif %}

<form method="post" style="max-width:420px;">
    {% csrf_token %}
    <div style="margin-bottom:12px;">
        <label for="username">Username (Email)</label>
        <input id="username" name="username" type="email" required style="display:block; width:100%; padding:10px; margin-top:4px;">
    </div>

    <div style="margin-bottom:12px;">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required style="display:block; width:100%; padding:10px; margin-top:4px;">
    </div>

    <div style="margin-bottom:16px;">
        <label for="confirm_password">Confirm Password</label>
        <input id="confirm_password" name="confirm_password" type="password" required style="display:block; width:100%; padding:10px; margin-top:4px;">
    </div>

    <button type="submit" class="btn">Create Account</button>
</form>

<div style="margin-top:14px;">
    <a href="{% url 'communications_login' %}" class="btn">Back to Login</a>
</div>

{% endblock %}
