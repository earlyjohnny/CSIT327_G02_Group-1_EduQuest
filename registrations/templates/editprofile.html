{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrations - Edit Profile</title>
    <link rel="stylesheet" href="{% static 'css/registrations.css' %}">
</head>
<body>
    <nav class="navbar">
        <span class="nav-brand">EduQuest</span>
        <div class="nav-right">
            <a href="{% url 'registrations_home' %}" class="btn-back">← Back to Home</a>
            <a href="{% url 'registrations_logout' %}" class="btn-logout">Log Off</a>
        </div>
    </nav>

    <div class="container">
        <div class="form-card">
            <h1>Edit Profile</h1>
            <form method="POST" action="{% url 'registrations_editprofile' %}">
                {% csrf_token %}
                {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                    <div class="field-error">{{ field.errors }}</div>
                    {% endif %}
                </div>
                {% endfor %}
                <div class="form-actions">
                    <a href="{% url 'registrations_home' %}" class="btn-cancel">Cancel</a>
                    <button type="submit" class="btn-submit">Update Profile</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
