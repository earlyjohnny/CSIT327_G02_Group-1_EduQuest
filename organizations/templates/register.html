{% extends 'base.html' %}

{% block title %}Register - EduQuest{% endblock %}

{% block content %}
<div class="auth-header">
    <h1 class="auth-title">EduQuest</h1>
    <p style="color: var(--text-secondary);">Register a new user account.</p>
</div>

{% if msg %}
<div class="custom-alert custom-alert-danger" style="margin-bottom: 1.5rem;">
    <svg style="width: 1.25rem; height: 1.25rem; flex-shrink: 0;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
    </svg>
    <span>{{ msg }}</span>
</div>
{% endif %}

{% if success %}
<div class="custom-alert custom-alert-success" style="margin-bottom: 1.5rem;">
    <svg style="width: 1.25rem; height: 1.25rem; flex-shrink: 0;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
    </svg>
    <span>{{ success }}</span>
</div>
{% endif %}

<div class="custom-card" style="padding: 2rem; border-radius: 12px; margin-bottom: 0;">
    <form method="post">
        {% csrf_token %}
        
        <div class="form-group">
            <label style="display: block; margin-bottom: 0.5rem; color: var(--text-secondary); font-size: 0.875rem; font-weight: 500;">Username <span class="required-star">*</span></label>
            <input type="text" name="txt_username" placeholder="Choose a username" required>
        </div>
        
        <div class="form-group">
            <label style="display: block; margin-bottom: 0.5rem; color: var(--text-secondary); font-size: 0.875rem; font-weight: 500;">Password <span class="required-star">*</span></label>
            <input type="password" name="txt_password" placeholder="Create password" required>
        </div>
        
        <div class="form-group">
            <label style="display: block; margin-bottom: 0.5rem; color: var(--text-secondary); font-size: 0.875rem; font-weight: 500;">Confirm Password <span class="required-star">*</span></label>
            <input type="password" name="txt_confirm_password" placeholder="Confirm password" required>
        </div>
        
        <button type="submit" class="btn-outline" style="width: 100%; justify-content: center; font-weight: 600; border-color: var(--primary);">
            Register
        </button>
    </form>
    
    <div style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem; color: var(--text-secondary);">
        Already have an account? <a href="{% url 'organizations:login' %}" style="color: var(--primary); font-weight: 600; text-decoration: none;">Sign In</a>
    </div>
</div>
{% endblock %}
