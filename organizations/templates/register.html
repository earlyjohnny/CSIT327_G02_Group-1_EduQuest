<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - EduQuest</title>
</head>

<body>
    <h2>EduQuest Registration</h2>
    <form method="post">
        {% csrf_token %}
        <input type="text" name="txt_username" placeholder="Username" required><br><br>
        <input type="password" name="txt_password" placeholder="Password" required><br><br>
        <input type="password" name="txt_confirm_password" placeholder="Confirm Password" required><br><br>
        <select name="txt_type">
            <option value="1">Student</option>
            <option value="0">Teacher</option>
        </select><br><br>
        <button type="submit">Register</button>
        <p style="color: red;">{{ msg }}</p>
        <p style="color: green;">{{ success }}</p>
    </form>
    <p><a href="{% url 'organizations:login' %}">Login</a></p>
</body>

</html>
