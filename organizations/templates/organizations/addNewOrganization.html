<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Organization - EduQuest</title>
</head>
<body>
    <h1>Add New Organization</h1>

    <form method="POST">
        {% csrf_token %}
        <table>
            {{ form.as_table }}
        </table>
        <br>
        <button type="submit">Save Organization</button>
    </form>

    <br>
    <a href="{% url 'organizations:index' %}">Back to Organizations</a>
</body>
</html>
